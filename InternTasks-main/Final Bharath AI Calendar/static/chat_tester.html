<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Calendar AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-right: 1px solid #e0e0e0;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            justify-content: flex-end;
        }

        .user-message .text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            max-width: 70%;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .assistant-message {
            justify-content: flex-start;
        }

        .assistant-message .text {
            background: #f0f0f0;
            color: #333;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            max-width: 70%;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .payment-link {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            max-width: 70%;
        }

        .payment-link strong {
            display: block;
            color: #856404;
            margin-bottom: 10px;
        }

        .payment-link a {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .payment-link a:hover {
            background: #ffb300;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }

        .payment-status {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            color: #1565c0;
            font-size: 14px;
            text-align: center;
            max-width: 70%;
        }

        .payment-status.polling {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .payment-status.success {
            background: #c8e6c9;
            border-left-color: #4CAF50;
            color: #2e7d32;
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .janmarashi-display {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
            max-width: 70%;
        }

        .janmarashi-display h3 {
            color: #7b1fa2;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .janmarashi-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(156, 39, 176, 0.2);
            font-size: 14px;
        }

        .janmarashi-item:last-child {
            border-bottom: none;
        }

        .janmarashi-label {
            font-weight: 600;
            color: #6a1b9a;
        }

        .janmarashi-value {
            color: #4a148c;
        }

        .kundali-display {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
            max-width: 70%;
        }

        .kundali-display h3 {
            color: #1565c0;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .kundali-display .janmarashi-item {
            border-bottom-color: rgba(33, 150, 243, 0.2);
        }

        .kundali-display .janmarashi-label {
            color: #1565c0;
        }

        .kundali-display .janmarashi-value {
            color: #0d47a1;
        }

        .kundali-display .download-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(33, 150, 243, 0.3);
        }

        .kundali-display .download-link {
            display: inline-block;
            background: #2196F3;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 14px;
            margin-top: 10px;
        }

        .kundali-display .download-link:hover {
            background: #1976D2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        .input-section {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #sendButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        #sendButton:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* Product Recommendations Styling */
        .recommendations-section {
            background: #ffffff;
            border: 1px dashed #c0bbf0;
            border-radius: 12px;
            padding: 14px 16px;
            margin: 12px 0;
            width: 65% !important;
            max-width: 65% !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            box-sizing: border-box;
        }

        .recommendations-title {
            font-size: 14px;
            font-weight: 700;
            color: #4b387a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: space-between !important;
            background: #ffffff;
            border: 1px solid #eef0ff;
            border-radius: 12px;
            padding: 10px 14px;
            transition: all 0.2s ease;
            gap: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .product-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.12);
        }

        .product-info-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 12px !important;
            flex: 1 !important;
            min-width: 0 !important;
        }

        .message img,
        .assistant-message img,
        .recommendations-section img,
        .product-card img,
        .product-img {
            width: 40px !important;
            height: 40px !important;
            min-width: 40px !important;
            min-height: 40px !important;
            max-width: 40px !important;
            max-height: 40px !important;
            object-fit: cover !important;
            border-radius: 8px !important;
            border: 1px solid #eef0ff !important;
            flex-shrink: 0 !important;
            display: block !important;
        }

        .product-details {
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            gap: 2px !important;
            overflow: hidden !important;
            flex: 1 !important;
            min-width: 0 !important;
        }

        .product-name {
            font-size: 13px !important;
            font-weight: 600 !important;
            color: #333333 !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            display: block !important;
        }

        .product-price {
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #2b6cb0 !important;
            display: block !important;
        }

        .product-link {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 5px !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #ffffff !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            padding: 7px 16px !important;
            border-radius: 18px !important;
            transition: all 0.2s ease !important;
            flex-shrink: 0 !important;
        }

        .product-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }

        @media (max-width: 768px) {

            .user-message .text,
            .assistant-message .text,
            .payment-link,
            .janmarashi-display,
            .kundali-display,
            .recommendations-section {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="chat-section">
            <div class="header">
                <h1>🌙 Bharat Calendar AI</h1>
                <p>Your Personal Astrology Assistant</p>
            </div>

            <div id="chatMessages"></div>

            <div class="input-section">
                <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
                <button id="sendButton" title="Send message">📤</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.origin}/invoke`;
        const PAYMENT_STATUS_URL = `${window.location.origin}/payment/status`;

        let chatHistory = [];
        let currentPaymentOrderId = null;
        let currentPollingInterval = null;
        let currentProductType = null;
        let pageRefreshProtection = true;

        console.log('🚀 Chat page initialized - Page Refresh Protection ENABLED');

        // ✅ PREVENT PAGE REFRESH/RELOAD
        window.addEventListener('beforeunload', (e) => {
            if (pageRefreshProtection) {
                console.log('🛡️ Page refresh protection triggered');
                e.preventDefault();
                e.returnValue = '';
                return false;
            }
        });

        // ✅ PREVENT NAVIGATION
        window.addEventListener('navigate', (e) => {
            if (pageRefreshProtection) {
                console.log('🛡️ Navigation blocked');
                e.preventDefault();
                return false;
            }
        });

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('sendButton').addEventListener('click', sendMessage);

        // ✅ LISTEN FOR PAYMENT COMPLETION VIA localStorage
        window.addEventListener('storage', (event) => {
            if (event.key === 'paymentCompleted') {
                console.log('🎉 Payment completion detected via storage event!');
                const paymentData = JSON.parse(event.newValue);
                handlePaymentCompletionFromStorage(paymentData);
            }
        });

        // ✅ PAGE LOAD - RESTORE SESSION OR SHOW WELCOME, AND CHECK FOR PAYMENT
        window.addEventListener('load', () => {
            console.log('📄 Page load event fired');

            const savedHTML = sessionStorage.getItem('savedChatMessages');
            const savedHistory = sessionStorage.getItem('savedChatHistory');

            if (savedHTML) {
                console.log('🔄 Restoring previous chat messages from session storage');
                document.getElementById('chatMessages').innerHTML = savedHTML;
                if (savedHistory) {
                    try {
                        chatHistory = JSON.parse(savedHistory);
                    } catch (e) {
                        console.error('Error parsing saved history:', e);
                    }
                }
            } else {
                addAssistantMessage('🌙 Welcome to Bharat Calendar AI!\n\nI can help you with:\n🌙 Janmarashi (Moon Sign)\n📊 Kundali (Birth Chart)\n🔮 Horoscope\n📅 Panchang\n✨ And much more!\n\nHow can I assist you today?');
            }

            // ✅ Check for payment data immediately
            checkForPaymentData();
        });

        // ✅ CHECK FOR PAYMENT DATA
        function checkForPaymentData() {
            console.log('🔍 Checking for payment data...');

            try {
                const paymentDataStr = localStorage.getItem('paymentCompleted');

                if (paymentDataStr) {
                    console.log('✅ Payment data found in localStorage');
                    try {
                        const paymentData = JSON.parse(paymentDataStr);
                        console.log('✅ Payment data parsed successfully:', paymentData);

                        // ✅ Process payment with delay to ensure all data is ready
                        setTimeout(() => {
                            handlePaymentCompletionFromStorage(paymentData);
                        }, 1000);

                    } catch (parseError) {
                        console.error('❌ Failed to parse payment data:', parseError);
                    }
                } else {
                    console.log('ℹ️  No payment data found in localStorage');
                }
            } catch (error) {
                console.error('❌ Error checking localStorage:', error);
            }
        }

        // =============================================
        // SEND MESSAGE TO CHAT
        // =============================================

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // ⏹️ Clear any active payment polling interval since a new request/action is starting
            if (currentPollingInterval) {
                console.log('⏹️ Stopping active payment polling interval');
                clearInterval(currentPollingInterval);
                currentPollingInterval = null;
            }

            input.value = '';
            addUserMessage(message);

            try {
                const payload = {
                    messages: [...chatHistory, { role: 'user', content: message }]
                };

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                console.log('📊 API Response:', data);

                chatHistory = data.messages || payload.messages;

                const msgs = data.messages || [];
                const last = msgs.length ? msgs[msgs.length - 1] : null;
                const assistantText = last && last.role === 'assistant' ? last.content : '[No response]';

                addAssistantMessage(assistantText);

                // Render Kundali report upsell CTA if available
                if (data.links?.report_upsell && data.links.report_upsell.type === 'kundali_offer') {
                    displayKundaliReportUpsell(data.links.report_upsell);
                }

                // Render product recommendations if available
                if (data.has_recommendations && (data.recommendations || data.links?.recommended_products)) {
                    displayProductRecommendations(data.recommendations, data.links);
                }

                if (data.links?.payment_link) {
                    const link = data.links.payment_link;
                    const linkHtml = `
                        <div class="payment-link">
                            <strong>${link.title}</strong><br>
                            <a href="${link.url}" target="_blank" rel="opener">
                                💳 Open Payment Page
                            </a>
                        </div>
                    `;
                    document.getElementById('chatMessages').innerHTML += linkHtml;

                    if (link.order_id) {
                        console.log('🎯 Payment link shown for order:', link.order_id);
                        currentPaymentOrderId = link.order_id;
                        currentProductType = link.product_type;
                        startPaymentPolling(link.order_id, link.product_type);
                    }
                }

                const box = document.getElementById('chatMessages');
                box.scrollTop = box.scrollHeight;

            } catch (e) {
                console.error('❌ Error:', e);
                addAssistantMessage(`Error: ${e.message}`);
            }
        }

        // =============================================
        // START POLLING FOR PAYMENT STATUS
        // =============================================

        function startPaymentPolling(orderId, productType) {
            if (currentPollingInterval) {
                clearInterval(currentPollingInterval);
            }

            const box = document.getElementById('chatMessages');
            let statusDiv = document.getElementById('paymentStatus');
            if (!statusDiv) {
                statusDiv = document.createElement('div');
                statusDiv.id = 'paymentStatus';
                box.appendChild(statusDiv);
            }
            statusDiv.style.display = 'block';
            statusDiv.className = 'payment-status polling';
            statusDiv.innerHTML = '🕐 Waiting for payment confirmation...';
            box.scrollTop = box.scrollHeight;

            let pollCount = 0;
            currentPollingInterval = setInterval(async () => {
                pollCount++;
                console.log(`⏱️  Poll #${pollCount} for order: ${orderId}`);

                try {
                    const response = await fetch(`${PAYMENT_STATUS_URL}?order_id=${orderId}`);
                    const result = await response.json();

                    if (result.success && result.payment_completed) {
                        if (result.status === 'pending_delivery' || result.delivery === 'pending') {
                            console.log('⏳ Payment verified, Janma Rashi calculation pending...', result);
                            statusDiv.className = 'payment-status polling';
                            statusDiv.innerHTML = '🔮 Payment received! Your Janma Rashi is being calculated...';
                        } else {
                            console.log('✅ PAYMENT COMPLETED & DELIVERED FROM POLLING!', result);
                            clearInterval(currentPollingInterval);

                            statusDiv.className = 'payment-status success';
                            statusDiv.innerHTML = '✅ Payment Verified Successfully!';

                            if (productType === 'janmarashi' || result.product_type === 'janmarashi') {
                                displayJanmarashiResults(result.data);
                                if (result.recommendations) {
                                    displayProductRecommendations(result.recommendations);
                                }
                            } else if (productType === 'kundali' || result.product_type === 'kundali') {
                                displayKundaliResults(result.data);
                                if (result.recommendations) {
                                    displayProductRecommendations(result.recommendations);
                                }
                            }

                            setTimeout(() => {
                                box.scrollTop = box.scrollHeight;
                            }, 100);
                        }
                    }

                } catch (error) {
                    console.error('❌ Polling error:', error);
                }
            }, 3000);
        }

        // =============================================
        // HANDLE PAYMENT COMPLETION FROM localStorage
        // =============================================

        function handlePaymentCompletionFromStorage(paymentData) {
            console.log('🎉 Processing payment from storage:', paymentData);
            // ✅ Clear paymentCompleted immediately so old data doesn't linger across refreshes
            localStorage.removeItem('paymentCompleted');

            const productType = paymentData.product_type;
            const result = paymentData.result;
            const orderId = paymentData.order_id;

            if (result && (result.delivery === 'pending' || result.status === 'pending_delivery' || !result.data)) {
                console.log('⏳ Payment verified but delivery is pending. Updating status display...');
                let statusDiv = document.getElementById('paymentStatus');
                if (statusDiv) {
                    statusDiv.className = 'payment-status polling';
                    statusDiv.innerHTML = '🔮 Payment received! Your Janma Rashi is being calculated...';
                }
                if (orderId && !currentPollingInterval) {
                    startPaymentPolling(orderId, productType);
                }
                return;
            }

            if (currentPollingInterval) {
                console.log('⏹️  Stopping polling');
                clearInterval(currentPollingInterval);
            }

            const statusDiv = document.getElementById('paymentStatus');
            if (statusDiv) {
                statusDiv.style.display = 'none';
            }

            const box = document.getElementById('chatMessages');

            const successMsg = document.createElement('div');
            successMsg.className = 'payment-status success';
            successMsg.innerHTML = '✅ Payment Verified Successfully!';
            box.appendChild(successMsg);

            if (productType === 'janmarashi' && result && result.data) {
                console.log('🌙 Displaying janmarashi from storage');
                displayJanmarashiResults(result.data);
                if (result.recommendations) {
                    displayProductRecommendations(result.recommendations);
                }
            } else if (productType === 'kundali' && result && result.data) {
                console.log('📊 Displaying kundali from storage');
                displayKundaliResults(result.data);
                if (result.recommendations) {
                    displayProductRecommendations(result.recommendations);
                }
            }

            box.scrollTop = box.scrollHeight;

            // ✅ Save updated chat state
            saveChatState();

            // ✅ Clear paymentCompleted so it doesn't show up again in future sessions
            localStorage.removeItem('paymentCompleted');
        }

        // =============================================
        // DISPLAY JANMARASHI RESULTS
        // =============================================

        function displayJanmarashiResults(data) {
            console.log('🌙 Creating janmarashi display');
            const box = document.getElementById('chatMessages');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'janmarashi-display';
            resultDiv.innerHTML = `
                <h3>🌙 Your Janmarashi (Moon Sign) Results</h3>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Moon Sign (Rashi):</span>
                    <span class="janmarashi-value">${data.rashi || 'N/A'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Moon Longitude:</span>
                    <span class="janmarashi-value">${data.moonLongitude || 'N/A'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Latitude:</span>
                    <span class="janmarashi-value">${data.latitude ?? '-'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Longitude:</span>
                    <span class="janmarashi-value">${data.longitude ?? '-'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Birth Date:</span>
                    <span class="janmarashi-value">${data.date || 'N/A'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Birth Time:</span>
                    <span class="janmarashi-value">${data.time || 'N/A'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Birth Place:</span>
                    <span class="janmarashi-value">${data.place || 'N/A'}</span>
                </div>
            `;
            box.appendChild(resultDiv);
            console.log('✅ Janmarashi displayed');
        }

        // =============================================
        // DISPLAY KUNDALI RESULTS
        // =============================================

        function displayKundaliResults(data) {
            console.log('📊 Creating kundali display with data:', data);
            const box = document.getElementById('chatMessages');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'kundali-display';

            let downloadUrl = data.download_url || '';
            console.log('📥 Download URL extracted:', downloadUrl);

            let content = `
                <h3>📊 Your Kundali (Birth Chart) Results</h3>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Birth Date:</span>
                    <span class="janmarashi-value">${data.date || 'N/A'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Birth Time:</span>
                    <span class="janmarashi-value">${data.time || 'N/A'}</span>
                </div>
                <div class="janmarashi-item">
                    <span class="janmarashi-label">Birth Place:</span>
                    <span class="janmarashi-value">${data.place || 'N/A'}</span>
                </div>
            `;

            if (downloadUrl && downloadUrl.trim() && downloadUrl !== 'undefined' && downloadUrl !== 'null') {
                console.log('✅ Valid download URL, adding button');
                content += `
                    <div class="download-section">
                        <a href="${downloadUrl}" class="download-link" download target="_blank">
                             Download Kundali PDF
                        </a>
                    </div>
                `;
            } else {
                console.warn('⚠️ No download URL:', downloadUrl);
                content += `
                    <div class="download-section" style="color: #d32f2f; font-size: 13px;">
                        ⚠️ PDF Download link will be emailed to you.
                    </div>
                `;
            }

            resultDiv.innerHTML = content;
            box.appendChild(resultDiv);
            console.log('✅ Kundali displayed in chat');
        }

        // =============================================
        // DISPLAY KUNDALI REPORT UPSELL CTA
        // =============================================

        function sendQuickMessage(text) {
            const input = document.getElementById('messageInput');
            if (input) {
                input.value = text;
                sendMessage();
            }
        }

        function displayKundaliReportUpsell(upsell) {
            console.log('✨ Creating Kundali report upsell CTA with data:', upsell);
            const box = document.getElementById('chatMessages');
            const card = document.createElement('div');
            card.className = 'report-upsell-card';
            card.style.cssText = 'background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px; border-radius: 12px; margin: 12px 0; max-width: 70%; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);';
            
            const ctaText = escapeHtml(upsell.cta || 'Get your detailed Kundali report');
            const priceVal = upsell.price != null ? upsell.price : '';
            const priceTag = priceVal ? ` (₹${priceVal})` : '';

            card.innerHTML = `
                <div style="font-weight: 600; font-size: 15px; margin-bottom: 6px;">✨ Personalized Kundali Report</div>
                <div style="font-size: 13px; opacity: 0.95; margin-bottom: 12px;">Get exact predictions, planetary Dashas & timing analysis.</div>
                <button onclick="sendQuickMessage('Generate my Kundali')" style="background: #ffc107; color: #1a1a1a; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease;">
                    ${ctaText}${priceTag}
                </button>
            `;
            box.appendChild(card);
            box.scrollTop = box.scrollHeight;
        }

        // =============================================
        // ADD MESSAGES TO CHAT & SAVE SESSION
        // =============================================

        function saveChatState() {
            try {
                const box = document.getElementById('chatMessages');
                if (box) {
                    sessionStorage.setItem('savedChatMessages', box.innerHTML);
                    sessionStorage.setItem('savedChatHistory', JSON.stringify(chatHistory));
                }
            } catch (e) {
                console.warn('Failed to save chat state:', e);
            }
        }

        function addUserMessage(text) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'message user-message';
            msg.innerHTML = `<div class="text">${escapeHtml(text)}</div>`;
            box.appendChild(msg);
            chatHistory.push({ role: 'user', content: text });
            saveChatState();
        }

        function addAssistantMessage(text) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'message assistant-message';
            msg.innerHTML = `<div class="text">${formatMessage(text)}</div>`;
            box.appendChild(msg);
            saveChatState();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessage(text) {
            let escaped = escapeHtml(text);
            // Convert Markdown links [Text](URL) to clickable HTML links
            escaped = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" style="color: #667eea; text-decoration: underline; font-weight: 600;">$1</a>');
            return escaped;
        }

        function shortenTitle(title, maxLen = 36) {
            if (!title) return 'Product';
            if (title.length <= maxLen) return title;
            return title.substring(0, maxLen).trim() + '...';
        }

        function createCardHtml(p) {
            const name = p.name || p.title || 'Product';
            const shortName = shortenTitle(name, 36);
            const link = p.link || p.url || '#';
            const price = p.price || p.price_range || '';
            const image = p.image || p.img || (p.images && p.images[0]) || '';

            const imgTag = image ? `<img src="${image}" class="product-img" alt="${name}" onerror="this.style.display='none';" />` : '';
            const priceTag = price ? `<span class="product-price">${price}</span>` : '';

            return `
                <div class="product-card">
                    <div class="product-info-container" style="display:flex; flex-direction:row; align-items:center; gap:12px; flex:1; min-width:0; overflow:hidden;">
                        ${imgTag}
                        <div class="product-details" style="display:flex; flex-direction:column; justify-content:center; gap:2px; overflow:hidden; flex:1; min-width:0;">
                            <span class="product-name" title="${name}" style="font-size:13px; font-weight:600; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">${shortName}</span>
                            ${priceTag}
                        </div>
                    </div>
                    <a href="${link}" target="_blank" class="product-link">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        Buy Now
                    </a>
                </div>
            `;
        }

        function displayProductRecommendations(recommendations, links) {
            const box = document.getElementById('chatMessages');
            const sec = document.createElement('div');
            sec.className = 'recommendations-section';

            let html = `
                <div class="recommendations-title">
                    ✨ Recommended Products For You
                </div>
                <div class="products-grid">
            `;

            let hasProducts = false;

            // Prioritize links.recommended_products array (capped to maximum_products, default 3)
            if (links && links.recommended_products && Array.isArray(links.recommended_products) && links.recommended_products.length > 0) {
                links.recommended_products.forEach(p => {
                    html += createCardHtml(p);
                });
                hasProducts = true;
            } else if (recommendations) {
                // Fallback to recommendations object
                if (recommendations.products && recommendations.products.length > 0) {
                    recommendations.products.forEach(p => {
                        html += createCardHtml(p);
                    });
                    hasProducts = true;
                }

            // Check for direct gemstone object
            if (recommendations.gemstone) {
                html += createCardHtml(recommendations.gemstone);
                hasProducts = true;
            }

            // Check for weak planet gemstone
            if (recommendations.weak_planet_gemstone) {
                html += createCardHtml(recommendations.weak_planet_gemstone);
                hasProducts = true;
            }

            // Check for direct rudraksha or lucky_number_rudraksha object
            const rudObj = recommendations.lucky_number_rudraksha || recommendations.rudraksha;
            if (rudObj) {
                html += createCardHtml(rudObj);
                hasProducts = true;
            }

            // Check for yantra
            if (recommendations.yantra) {
                html += createCardHtml(recommendations.yantra);
                hasProducts = true;
            }

            // Check for lagna yantra
            if (recommendations.lagna_yantra) {
                html += createCardHtml(recommendations.lagna_yantra);
                hasProducts = true;
            }

            // Check for festival gods
            if (recommendations.festival_gods && recommendations.festival_gods.length > 0) {
                recommendations.festival_gods.forEach(god => {
                    html += createCardHtml(god);
                });
                hasProducts = true;
            }

            // 2. Check for gemstone products
            if (recommendations.gemstone_products && recommendations.gemstone_products.length > 0) {
                recommendations.gemstone_products.forEach(p => {
                    html += createCardHtml(p);
                });
                hasProducts = true;
            }

            // 3. Check for rudraksha products
            if (recommendations.rudraksha_products && recommendations.rudraksha_products.length > 0) {
                recommendations.rudraksha_products.forEach(p => {
                    html += createCardHtml(p);
                });
                hasProducts = true;
            }

            // 4. Check for puja items
            if (recommendations.puja_kit) {
                html += createCardHtml(recommendations.puja_kit);
                hasProducts = true;
            }

            if (recommendations.decoration_kit) {
                html += createCardHtml(recommendations.decoration_kit);
                hasProducts = true;
            }

            if (recommendations.lucky_color_product) {
                html += createCardHtml(recommendations.lucky_color_product);
                hasProducts = true;
            }
            }

            html += `</div>`;
            sec.innerHTML = html;

            if (hasProducts) {
                box.appendChild(sec);
                box.scrollTop = box.scrollHeight;
                console.log('✅ Displayed product recommendations in chatbot');
            }
        }
    </script>
</body>

</html>
